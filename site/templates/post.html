{% extends "base.html" %}

{% block header %}
<header>
  <nav id="overlord" class="overlord" >
    {{ <mini_logo classes="" title={config.title} siteurl={config.base_url} logourl={config.extra.profile} /> }}
  </nav>

  {{ <site_nav base_url={config.base_url} /> }}
</header>
{% endblock header %}

{% block content %}
  <section class="container">
    <article>
      {% block post %}
        <h1 class="article-title"><a href="{{page.permalink}}" id="article-link">{{ page.title }}</a></h1>
        {{ <frontmatter classes="frontmatter-page" author={page.extra.author} date={page.date} word_count={page.word_count} read_time={page.reading_time} /> }}
        {{ page.content | safe }}
      {% endblock post %}
    </article>
  </section>
{% endblock content %}
