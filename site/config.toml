base_url = "https://rune-rs.github.io"

title = "The Rune Programming Language"
description="Party dynamically like it's 1995"
default_language = "en"

generate_feeds = true
feed_filenames = ["rss.xml"]
feed_limit = 20
compile_sass = true
build_search_index = false

taxonomies = [
  { name = "categories", feed = true, render = false },
  { name = "tags", feed = true, render = false },
]

[markdown.highlighting]
theme = "github-dark"
extra_grammars = ["syntaxes/rune.tmLanguage.json"]

[extra]
profile = "logo.png"
github = "rune-rs"
discord = "https://discord.gg/v5AeNkT"
book = "rune-rs.github.io/book/"
playground = """
fn fib(n) {
    if n <= 1 {
        n
    } else {
        fib(n - 1) + fib(n - 2)
    }
}

pub fn main() {
    fib(15)
}
"""
