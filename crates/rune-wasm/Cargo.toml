[package]
name = "rune-wasm"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2021"
rust-version = "1.100"
description = "A WASM module for the Rune Language, an embeddable dynamic programming language for Rust."
documentation = "https://docs.rs/rune"
readme = "README.md"
repository = "https://github.com/rune-rs/rune"
license = "MIT OR Apache-2.0"
keywords = ["language", "scripting", "scripting-language"]
categories = ["parser-implementations"]
publish = false

[dependencies]
rune = { version = "0.15.0", path = "../rune", features = ["capture-io"] }
rune-macros = { version = "=0.15.0", path = "../rune-macros" }
rune-modules = { version = "0.15.0", path = "../rune-modules", features = ["core", "test", "json", "toml", "rand"] }

serde = { version = "1.0.163", features = ["derive"] }
wasm-bindgen = { version = "=0.2.130", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
anyhow = "1.0.104"
gloo-utils = "0.3.1"
serde_json = "1.0.154"
yew = { version = "0.23.0", features = ["csr"] }

[dependencies.web-sys]
version = "0.3.107"
features = [
    "Document",
    "Element",
    "History",
    "InputEvent",
    "HtmlDocument",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "Node",
    "NodeList",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "UrlSearchParams",
    "Window",
]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
